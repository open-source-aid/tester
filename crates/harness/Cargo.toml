[package]
name = "tester-harness"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "In-process harness: runs a device engine against a simulator with virtual time, faults and invariants"
license = "AGPL-3.0-or-later"
repository = "https://github.com/open-source-aid/tester"
keywords = ["simulation", "testing", "ble", "medical-device"]
categories = ["development-tools::testing"]

[dependencies]
curve25519-dalek = { version = "4.1", default-features = false }
pump-shared = { git = "https://github.com/open-source-aid/pump-shared", branch = "main", features = ["sim"] }
