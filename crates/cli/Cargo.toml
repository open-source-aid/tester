[package]
name = "tester"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Runs device scenarios in process or over BLE against a hardware simulator"
license = "AGPL-3.0-or-later"
repository = "https://github.com/open-source-aid/tester"
keywords = ["simulation", "testing", "ble", "medical-device"]
categories = ["development-tools::testing", "command-line-utilities"]

[features]
radio = ["tester-ble/radio", "dep:serialport"]

[dev-dependencies]
# The simulated sensor, to drive the host loop without a radio. Behind the
# driver's own `sim` feature, and only ever a test dependency here: the
# in-process target is `simulator-bridge`'s business, not this crate's.
cgm-dexcom = { git = "ssh://git@github.com/open-source-aid/cgm-dexcom.git", branch = "main", features = ["g6", "g7", "sim"] }

[dependencies]
cgm-dexcom = { git = "ssh://git@github.com/open-source-aid/cgm-dexcom.git", branch = "main", features = ["g6", "g7"] }
cgm-shared = { git = "https://github.com/open-source-aid/cgm-shared", branch = "main", features = ["sim"] }
pump-shared = { git = "https://github.com/open-source-aid/pump-shared", branch = "main", features = ["sim"] }
pump-ypso = { git = "https://github.com/open-source-aid/pump-ypso", branch = "main", features = ["sim", "opn", "delivery"] }
serialport = { version = "4.10", optional = true }
simulator-bridge = { git = "https://github.com/open-source-aid/simulator", branch = "main", features = ["ypso-sim"] }
tester-ble = { path = "../ble" }
tester-harness = { path = "../harness", features = ["cgm"] }
